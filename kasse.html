<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kasse – Form Werk Atelier</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>

  <div data-fwa-header></div>

  <section class="hero container" style="padding: 4rem 0 2rem;">
    <p class="hero__eyebrow">Schritt 2 von 2</p>
    <h1>Kasse</h1>
  </section>

  <section class="section" style="padding-top: 1rem;">
    <div class="container">

      <div id="checkoutRoot">
        <div class="checkout-grid">

          <!-- ====== LINKS: Rechnungs-/Lieferadresse ====== -->
          <div class="checkout-main">
            <h2 class="checkout-section-title">Lieferadresse</h2>

            <form id="checkoutForm" class="checkout-form" novalidate>
              <div class="form-row">
                <label>Vorname *
                  <input name="vorname" type="text" required autocomplete="given-name" />
                </label>
                <label>Nachname *
                  <input name="nachname" type="text" required autocomplete="family-name" />
                </label>
              </div>

              <label>E-Mail *
                <input name="email" type="email" required autocomplete="email" />
              </label>

              <label>Telefon (optional)
                <input name="telefon" type="tel" autocomplete="tel" />
              </label>

              <div class="form-row">
                <label style="flex:3;">Straße + Hausnr. *
                  <input name="strasse" type="text" required autocomplete="street-address" />
                </label>
              </div>

              <div class="form-row">
                <label style="flex:1;">PLZ *
                  <input name="plz" type="text" required pattern="[0-9]{5}" autocomplete="postal-code" />
                </label>
                <label style="flex:2;">Ort *
                  <input name="ort" type="text" required autocomplete="address-level2" />
                </label>
              </div>

              <label>Land *
                <select name="land" required>
                  <option value="Deutschland" selected>Deutschland</option>
                  <option value="Österreich">Österreich</option>
                  <option value="Schweiz">Schweiz</option>
                </select>
              </label>

              <label>Anmerkung (optional)
                <textarea name="anmerkung" rows="2" placeholder="Hinweise zur Lieferung …"></textarea>
              </label>

              <!-- Honeypot gegen Spam-Bots -->
              <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"
                     style="position:absolute; left:-9999px; opacity:0;" />

              <h2 class="checkout-section-title" style="margin-top: 2.5rem;">Bezahlart</h2>

              <div class="payment-options">
                <label class="payment-option">
                  <input type="radio" name="zahlung" value="paypal" checked />
                  <span class="payment-option__label">
                    <strong>PayPal</strong>
                    <small>Sofortige Zahlung via PayPal-Konto, Kreditkarte oder Lastschrift.</small>
                  </span>
                </label>

                <label class="payment-option">
                  <input type="radio" name="zahlung" value="vorkasse" />
                  <span class="payment-option__label">
                    <strong>Vorkasse (Überweisung)</strong>
                    <small>Wir senden dir die Bankdaten per E-Mail. Versand erfolgt nach Zahlungseingang.</small>
                  </span>
                </label>
              </div>

              <div class="legal-checks">
                <label class="check">
                  <input type="checkbox" name="agb" required />
                  Ich akzeptiere die <a href="agb.html" target="_blank">AGB</a> und <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a>.
                </label>
                <label class="check">
                  <input type="checkbox" name="widerruf" required />
                  <a href="widerruf.html" target="_blank">Widerrufsbelehrung</a> zur Kenntnis genommen.
                </label>
              </div>

              <!-- PayPal-Buttons ODER Vorkasse-Submit -->
              <div id="paypalButtonContainer" class="paypal-button-container"></div>
              <button type="button" id="vorkasseSubmit" class="btn" style="display:none; width:100%;">
                Kostenpflichtig bestellen (Vorkasse)
              </button>

              <p id="checkoutError" class="checkout-error" style="display:none;"></p>
            </form>
          </div>

          <!-- ====== RECHTS: Bestellübersicht ====== -->
          <aside class="checkout-summary" id="checkoutSummary">
            <!-- wird per JS befüllt -->
          </aside>

        </div>
      </div>

      <!-- ====== ERFOLGS-SEITE (versteckt bis Bestellung) ====== -->
      <div id="checkoutSuccess" style="display:none;"></div>

    </div>
  </section>

  <div data-fwa-footer></div>

  <script src="data/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
