<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden – Form Werk Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <div data-fwa-header></div>

  <section class="hero container" style="padding: 4rem 0 2rem;">
    <p class="hero__eyebrow">Konto</p>
    <h1>Anmelden</h1>
    <p>Melde dich an, um deine Bestellhistorie zu sehen und schneller zu bestellen.</p>
  </section>

  <section class="section">
    <div class="container container--narrow">

      <div class="auth-card">
        <form id="loginForm" class="checkout-form" novalidate>

          <label>E-Mail-Adresse <span class="required">*</span>
            <input name="email" type="email" required autocomplete="email" />
          </label>

          <label>Passwort <span class="required">*</span>
            <input name="password" type="password" required autocomplete="current-password" minlength="6" />
          </label>

          <p id="loginResult" class="form-message" style="display:none;"></p>

          <button type="submit" class="btn btn--full">Anmelden</button>

        </form>
      </div>

      <p style="margin-top:1.5rem; text-align:center; font-size: 0.92rem; color: var(--color-text-soft);">
        Noch kein Konto? <a href="registrieren.html">Jetzt registrieren</a><br>
        <a href="passwort-vergessen.html">Passwort vergessen?</a>
      </p>

    </div>
  </section>

  <div data-fwa-footer></div>

  <script src="data/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const result = document.getElementById('loginResult');
      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        const email = form.email.value.trim();
        const password = form.password.value;

        result.style.display = 'block';
        result.className = 'form-message';
        result.textContent = 'Anmeldung läuft …';

        if (!window.FWA_SUPABASE) await new Promise(r => window.addEventListener('fwa-supabase-ready', r, { once: true }));

        const { data, error } = await window.FWA_Auth.signIn(email, password);
        if (error) {
          result.className = 'form-message form-message--error';
          result.textContent = 'Anmeldung fehlgeschlagen: ' + (error.message || 'Unbekannter Fehler');
          return;
        }
        result.className = 'form-message form-message--success';
        result.textContent = '✓ Erfolgreich angemeldet. Weiterleitung …';
        setTimeout(() => window.location.href = 'mein-konto.html', 800);
      });
    })();
  </script>
</body>
</html>
